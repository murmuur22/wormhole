<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wormhole</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/forms.css"></head><body><main id="portal"><section id="chamber" aria-label="Animated ASCII wormhole"><div id="scene"></div><div class="viewport-top"><span class="wordmark">wormhole</span><div><button id="motion">Pause motion ‖</button><form method="post" action="/logout/">{% csrf_token %}<button>Sign out ↗</button></form></div></div><div id="cargo" hidden><span>▤</span><b id="cargo-name"></b></div><div id="dropzone" class="viewport-drop" aria-hidden="true"></div><div class="upload-controls" aria-label="Upload file"><div class="control-row"><label class="file-choice" for="file"><span id="file-name">Choose a file ↗</span><input type="file" id="file"></label><label class="sr-only" for="bucket">Destination</label><select id="bucket" aria-label="Destination"></select><button class="primary" id="toss" disabled>Toss ↗</button></div><div class="control-detail"><span id="file-size">or drop a file anywhere</span><span>{{ user.username }} · upload only</span></div><p role="status" id="status"></p></div><span class="prototype-label">SHARED ARCHIVE</span><span id="mode" class="state-label">AWAITING CARGO</span></section></main><script type="module" src="/static/portal.js"></script></body></html>
