<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wormhole · Sign in</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/forms.css"></head><body><main id="login"><form class="login-block" method="post">{% csrf_token %}<h1>wormhole</h1><div class="auth-fields"><label>Username<input name="username" autocomplete="username" required maxlength="80"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label></div>{% if form.errors %}<p role="alert">Sign-in failed. Check your credentials and account access.</p>{% endif %}<button class="primary">Sign in ↗</button></form></main></body></html>
